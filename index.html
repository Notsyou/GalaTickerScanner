<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Autumn Blush — Check-in</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
  :root {
    --bg: #171310;
    --panel: #241d18;
    --ink: #f4ece1;
    --muted: #b9a996;
    --accent: #e8734a;
    --valid: #3f9d5c;
    --used: #c94c3f;
    --unknown: #4a4038;
    --line: #3a3128;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #app { height: 100%; display: flex; flex-direction: column; }

  header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
    flex-shrink: 0;
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: 0.02em; }
  header h1 span { color: var(--accent); }
  #status-pill {
    font-size: 11px; padding: 4px 10px; border-radius: 999px;
    background: var(--panel); color: var(--muted); border: 1px solid var(--line);
  }
  #status-pill.ready { color: var(--valid); border-color: var(--valid); }
  #status-pill.error { color: var(--used); border-color: var(--used); }
  #engine-tag {
    font-size: 10px; color: var(--muted); margin-top: 2px;
  }

  #scan-area { flex: 1; position: relative; background: #000; min-height: 0; overflow: hidden; }
  #reader-video { width: 100%; height: 100%; object-fit: cover; }

  #scan-guide {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 70%; height: 90px; border: 2px solid var(--accent);
    border-radius: 8px; pointer-events: none; z-index: 5;
  }

  #loading {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; color: var(--muted);
    font-size: 13px; text-align: center; padding: 0 30px; z-index: 6;
    background: #000;
  }
  #loading .spinner {
    width: 26px; height: 26px; border-radius: 50%;
    border: 2px solid var(--line); border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  footer {
    padding: 10px 18px; flex-shrink: 0; border-top: 1px solid var(--line);
    text-align: center;
  }
  #scan-count { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  #manual-toggle {
    background: none; border: none; color: var(--accent);
    font-size: 13px; text-decoration: underline; padding: 4px;
    display: block; width: 100%;
  }
  #capture-toggle {
    background: var(--accent); border: none; color: #fff;
    font-size: 14px; font-weight: 600; padding: 10px 20px;
    border-radius: 10px; margin-bottom: 8px; width: 100%;
  }

  #manual-entry {
    position: fixed; inset: 0; z-index: 30; display: none;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.6); padding: 24px;
  }
  #manual-entry.show { display: flex; }
  #manual-panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 14px; padding: 24px; width: 100%; max-width: 340px;
  }
  #manual-panel p { margin: 0 0 12px; font-size: 14px; color: var(--muted); }
  #manual-input {
    width: 100%; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    font-size: 16px; margin-bottom: 14px;
  }
  #manual-buttons { display: flex; gap: 10px; }
  #manual-buttons button {
    flex: 1; padding: 12px; border-radius: 10px; border: none;
    font-size: 14px; font-weight: 600;
  }
  #manual-cancel { background: var(--bg); color: var(--muted); }
  #manual-submit { background: var(--accent); color: #fff; }

  #result {
    position: fixed; inset: 0; z-index: 20;
    display: none; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 32px;
  }
  #result.show { display: flex; }
  #result.valid { background: var(--valid); }
  #result.used { background: var(--used); }
  #result.unknown { background: var(--unknown); }

  #result .icon { font-size: 56px; line-height: 1; margin-bottom: 18px; }
  #result .name { font-size: 30px; font-weight: 700; margin: 0 0 6px; }
  #result .message { font-size: 16px; opacity: 0.9; margin: 0; }
  #result .sub { font-size: 13px; opacity: 0.75; margin-top: 14px; }

  #result .dismiss {
    margin-top: 34px; padding: 12px 28px; border-radius: 10px;
    background: rgba(0,0,0,0.2); color: #fff; border: none;
    font-size: 14px; font-weight: 600;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <h1>Autumn Blush <span>· Check-in</span></h1>
      <div id="engine-tag">detecting scan engine…</div>
    </div>
    <div id="status-pill">loading guest list…</div>
  </header>

  <div id="scan-area">
    <video id="reader-video" autoplay playsinline muted></video>
    <div id="scan-guide"></div>
    <div id="loading">
      <div class="spinner"></div>
      <div>Loading guest list — once ready, aim at the ticket and tap "capture & read".</div>
    </div>
  </div>

  <footer>
    <div id="scan-count">0 checked in this session</div>
    <button id="capture-toggle" onclick="captureAndScan()">📝 Tap to capture &amp; read ticket ID</button>
    <button id="manual-toggle" onclick="toggleManualEntry()">Can't scan? Enter ticket ID manually</button>
  </footer>
</div>

<div id="manual-entry">
  <div id="manual-panel">
    <p>Enter ticket ID</p>
    <input type="text" id="manual-input" placeholder="e.g. AB-3-SEMZ" autocapitalize="characters">
    <div id="manual-buttons">
      <button id="manual-cancel" onclick="toggleManualEntry()">Cancel</button>
      <button id="manual-submit" onclick="submitManualEntry()">Check in</button>
    </div>
  </div>
</div>

<div id="result">
  <div class="icon" id="result-icon"></div>
  <div class="name" id="result-name"></div>
  <p class="message" id="result-message"></p>
  <div class="sub" id="result-sub"></div>
  <button class="dismiss" onclick="dismissResult()">Scan next</button>
</div>

<script>
  // ---- CONFIG ----
  var GUEST_LIST_URL = "https://script.google.com/macros/s/AKfycbyPYAw-kyvqG3wAMohaL8VSlL1QXNWSrDTjAYuGc9aLmRf0t2X2x-qDcABrwr7sv7_H/exec";
  var CHECKIN_POST_URL = "https://script.google.com/macros/s/AKfycbyPYAw-kyvqG3wAMohaL8VSlL1QXNWSrDTjAYuGc9aLmRf0t2X2x-qDcABrwr7sv7_H/exec";

  var guestList = {};
  var sessionCount = 0;
  var scanningLocked = false;
  var detector = null;
  var videoEl = null;
  var detectLoopHandle = null;

  function loadGuestList(isRefresh) {
    fetch(GUEST_LIST_URL)
      .then(function(res) { return res.json(); })
      .then(function(data) {
        data.forEach(function(g) {
          var key = g.ticketId.trim().toUpperCase();
          var existing = guestList[key];
          guestList[key] = {
            ticketId: g.ticketId,
            name: g.name,
            checkedIn: (existing && existing.checkedIn) || g.checkedIn,
            checkedInAt: (existing && existing.checkedInAt) || g.checkedInAt
          };
        });

        console.log((isRefresh ? "Refreshed" : "Loaded") + " ticket IDs:", Object.keys(guestList));
        document.getElementById("status-pill").textContent =
          Object.keys(guestList).length + " guests · synced " + new Date().toLocaleTimeString();
        document.getElementById("status-pill").className = "ready";

        if (!isRefresh) {
          document.getElementById("loading").style.display = "none";
          initScanner();
        }
      })
      .catch(function(err) {
        if (!isRefresh) {
          document.getElementById("status-pill").textContent = "failed to load list";
          document.getElementById("status-pill").className = "error";
          document.getElementById("loading").innerHTML =
            "<div>Couldn't load the guest list. Check your connection and reload this page before scanning.</div>";
        }
      });
  }

  function initScanner() {
    getDetector()
      .then(function(det) {
        detector = det;
        return startCamera();
      })
      .then(function() {
        detectLoopHandle = setInterval(runDetection, 200);
      })
      .catch(function(err) {
        console.error("Scanner init failed:", err);
        document.getElementById("engine-tag").textContent = "camera/detector error — use manual entry";
      });
  }

  // Prefer the browser's native BarcodeDetector (same engine Google Lens uses).
  // Fall back to a WASM-based polyfill only if native support is missing.
  function getDetector() {
    if ("BarcodeDetector" in window) {
      document.getElementById("engine-tag").textContent = "engine: native BarcodeDetector";
      return Promise.resolve(new BarcodeDetector({ formats: ["code_128"] }));
    }
    document.getElementById("engine-tag").textContent = "engine: WASM fallback (loading…)";
    return import("https://cdn.jsdelivr.net/npm/barcode-detector@2/dist/es/pure.min.js")
      .then(function(mod) {
        document.getElementById("engine-tag").textContent = "engine: WASM fallback";
        return new mod.BarcodeDetector({ formats: ["code_128"] });
      });
  }

  function startCamera() {
    return navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }
    }).then(function(stream) {
      videoEl = document.getElementById("reader-video");
      videoEl.srcObject = stream;
      return videoEl.play();
    });
  }

  function runDetection() {
    if (!detector || !videoEl || scanningLocked) return;
    detector.detect(videoEl)
      .then(function(barcodes) {
        if (barcodes && barcodes.length > 0) {
          onScanSuccess(barcodes[0].rawValue);
        }
      })
      .catch(function() { /* ignore per-frame detection errors */ });
  }

  function onScanSuccess(ticketId) {
    if (scanningLocked) return;
    scanningLocked = true;
    handleTicket(ticketId.trim());
  }

  function captureAndScan() {
    if (!videoEl) {
      showResult("unknown", "✕", "Camera not ready", "Wait a moment and try again", "");
      return;
    }

    var btn = document.getElementById("capture-toggle");
    var originalLabel = btn.textContent;
    btn.textContent = "🔎 Reading…";
    btn.disabled = true;

    var canvas = document.createElement("canvas");
    canvas.width = videoEl.videoWidth || 1280;
    canvas.height = videoEl.videoHeight || 720;
    canvas.getContext("2d").drawImage(videoEl, 0, 0, canvas.width, canvas.height);

    getOcrWorker()
      .then(function(worker) { return worker.recognize(canvas); })
      .then(function(result) {
        btn.textContent = originalLabel;
        btn.disabled = false;

        var text = (result.data.text || "").toUpperCase();
        var match = text.match(/AB-\d+-[A-Z0-9]{4}/);

        if (match) {
          handleTicket(match[0]);
        } else {
          showResult("unknown", "✕", "Couldn't read the ID", "Line up the printed Ticket ID text and try again", "");
        }
      })
      .catch(function(err) {
        console.error("OCR error:", err);
        btn.textContent = originalLabel;
        btn.disabled = false;
        showResult("unknown", "✕", "Couldn't read the ID", "Try again, or use manual entry", "");
      });
  }

  var ocrWorker = null;
  var ocrWorkerLoading = null;

  function getOcrWorker() {
    if (ocrWorker) return Promise.resolve(ocrWorker);
    if (ocrWorkerLoading) return ocrWorkerLoading;

    ocrWorkerLoading = Tesseract.createWorker("eng")
      .then(function(worker) {
        return worker.setParameters({
          tessedit_char_whitelist: "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-"
        }).then(function() {
          ocrWorker = worker;
          return worker;
        });
      });
    return ocrWorkerLoading;
  }

  function handleTicket(ticketId) {
    var guest = guestList[ticketId.trim().toUpperCase()];

    if (!guest) {
      showResult("unknown", "✕", "Not recognized", "Ticket not found — " + ticketId, "");
      return;
    }
    if (guest.checkedIn) {
      showResult("used", "⚠", guest.name, "Already checked in", guest.checkedInAt ? "at " + guest.checkedInAt : "");
      return;
    }

    guest.checkedIn = true;
    guest.checkedInAt = new Date().toLocaleTimeString();
    sessionCount++;
    document.getElementById("scan-count").textContent = sessionCount + " checked in this session";
    showResult("valid", "✓", guest.name, "Entry approved", "");

    queueCheckinSync(ticketId, guest.checkedInAt);
  }

  function queueCheckinSync(ticketId, timestamp) {
    if (CHECKIN_POST_URL.indexOf("PASTE_YOUR") === 0) return;
    fetch(CHECKIN_POST_URL, {
      method: "POST",
      body: JSON.stringify({ ticketId: ticketId, checkedInAt: timestamp })
    }).catch(function() {});
  }

  function showResult(kind, icon, name, message, sub) {
    var el = document.getElementById("result");
    el.className = "show " + kind;
    document.getElementById("result-icon").textContent = icon;
    document.getElementById("result-name").textContent = name;
    document.getElementById("result-message").textContent = message;
    document.getElementById("result-sub").textContent = sub;
  }

  function dismissResult() {
    document.getElementById("result").className = "";
    scanningLocked = false;
  }

  function toggleManualEntry() {
    var el = document.getElementById("manual-entry");
    el.classList.toggle("show");
    if (el.classList.contains("show")) {
      document.getElementById("manual-input").value = "";
      document.getElementById("manual-input").focus();
    }
  }

  function submitManualEntry() {
    var id = document.getElementById("manual-input").value.trim();
    if (!id) return;
    toggleManualEntry();
    handleTicket(id);
  }

  loadGuestList(false);
  setInterval(function() { loadGuestList(true); }, 60000);
</script>
</body>
</html>
